[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acve"
version = "0.1.0"
description = "Agentic Configuration Vulnerability Enumeration -- a CVE-style registry format for resolved AI agent configurations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
acve = "acve.cli:main"

[tool.setuptools]
packages = ["acve"]

[tool.setuptools.package-data]
acve = []
