name: validate

on:
  push:
  pull_request:

jobs:
  check:
    # NOTE: if this repo is ever made private, runs-on must switch to
    # [self-hosted, Linux] -- hosted runners are public-repo only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m acve build-feed records -o /tmp/feed.jsonl
      - run: python -m acve validate examples/agent-lock.example.json agent-lock
      - run: python -m acve hash examples/agent-lock.example.json --verify
